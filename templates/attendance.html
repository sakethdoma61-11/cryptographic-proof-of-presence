{% extends "base.html" %}{% block content %}<div class="page-head"><div><div class="pill">AUDIT LEDGER</div><h1>Attendance Records</h1></div></div><div class="card table-card"><table><tr><th>#</th><th>Student</th><th>Course</th><th>Room</th><th>Timestamp</th><th>Record Hash</th></tr>{% for r in rows %}<tr><td>{{r.id}}</td><td><b>{{r.student_id}}</b></td><td>{{r.course}}</td><td>{{r.room}}</td><td>{{r.timestamp}}</td><td class="mono">{{r.record_hash[:24]}}…</td></tr>{% else %}<tr><td colspan="6">No records.</td></tr>{% endfor %}</table></div>{% endblock %}
